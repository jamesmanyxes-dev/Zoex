<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#04141a"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="stroke" x1="150" y1="120" x2="362" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7df9ff"/>
      <stop offset="1" stop-color="#00b8d4"/>
    </linearGradient>
    <radialGradient id="halo" cx="256" cy="256" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="200" fill="url(#halo)"/>

  <!-- orbit ring -->
  <ellipse cx="256" cy="256" rx="176" ry="176" stroke="#00e5ff" stroke-opacity="0.18" stroke-width="3" fill="none"/>
  <circle cx="256" cy="80" r="7" fill="#7df9ff"/>

  <!-- Z mark -->
  <g filter="url(#glow)">
    <path d="M172 164 H340 L172 348 H340" stroke="url(#stroke)" stroke-width="34"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- spark -->
  <path d="M362 140 l6 18 18 6 -18 6 -6 18 -6 -18 -18 -6 18 -6 z" fill="#7df9ff"/>
</svg>
